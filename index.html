function Toast({ message, onDone }) {
  useEffect(() => {
    if (!message) return;
    const t = setTimeout(onDone, 2400);
    return () => clearTimeout(t);
  }, [message, onDone]);
  return message ? <div className="toast" role="status" aria-live="polite">{message}</div> : null;
}

/* ════════════════════════════════════════════════════════════
   EMOJI IMAGE — renderizza un'emoji come SVG OpenMoji (con cache)
   o, in fallback, come emoji Unicode di sistema.
   ════════════════════════════════════════════════════════════ */
function EmojiImage({ emoji, size = 40, style = {} }) {
  const cache = getOpenmojiCache();
  const cached = cache[emoji];
  const [svg, setSvg] = useState(cached || null);
  const [failed, setFailed] = useState(_openmojiFailed.has(emoji));

  useEffect(() => {
    if (!emoji) return;
    if (cache[emoji]) { setSvg(cache[emoji]); setFailed(false); return; }
    if (_openmojiFailed.has(emoji)) { setFailed(true); return; }
    let cancelled = false;
    fetchOpenmoji(emoji)
      .then(d => { if (!cancelled) { setSvg(d); setFailed(false); } })
      .catch(() => { if (!cancelled) setFailed(true); });
    return () => { cancelled = true; };
  }, [emoji]);

  if (!emoji) {
    return <span style={{fontSize: size * 0.55, color: '#bbb', ...style}}>—</span>;
  }
  if (failed) {
    return <span style={{fontSize: size * 0.78, lineHeight: 1, ...style}}>{emoji}</span>;
  }
  if (!svg) {
    return <span style={{fontSize: size * 0.78, opacity: 0.5, lineHeight: 1, ...style}}>{emoji}</span>;
  }
  return (
    <img src={svg} alt="" width={size} height={size} className="emoji-img" style={style} />
  );
}

/* ════════════════════════════════════════════════════════════
   EXPORT PDF VETTORIALE (Punti 19 + 21 + "PDF vettoriale")
   ─ jsPDF disegna shape/testi in vettoriale.
   ─ Le emoji sono renderizzate come piccoli PNG individuali via canvas
     (necessario perché jsPDF non incorpora font emoji a colori).
   ─ Pagination: ogni nucleo che non entra nello spazio rimasto va a pagina nuova.
   ════════════════════════════════════════════════════════════ */
// Renderizza un'emoji come PNG, preferendo OpenMoji se in cache.
// Ritorna direttamente il data URL.
function renderEmojiPNG(emoji, sizePx) {
  // Fallback: emoji di sistema
  const c = document.createElement('canvas');
  c.width = sizePx;
  c.height = sizePx;
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, sizePx, sizePx);
  ctx.font = `${Math.round(sizePx * 0.78)}px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(emoji, sizePx / 2, sizePx / 2 + sizePx * 0.04);
  return c.toDataURL('image/png');
}

// Async: ottiene PNG di OpenMoji se disponibile, altrimenti fallback Unicode
function getEmojiPNGAsync(emoji, sizePx) {
  return new Promise(resolve => {
    const cache = getOpenmojiCache();
    const dataUrl = cache[emoji];
    if (!dataUrl || _openmojiFailed.has(emoji)) {
      resolve(renderEmojiPNG(emoji, sizePx));
      return;
    }
    // Renderizza SVG in canvas a sizePx
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = sizePx; c.height = sizePx;
      const ctx = c.getContext('2d');
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(img, 0, 0, sizePx, sizePx);
      resolve(c.toDataURL('image/png'));
    };
    img.onerror = () => resolve(renderEmojiPNG(emoji, sizePx));
    img.src = dataUrl;
  });
}

async function drawTileVector(pdf, tile, x, y, w, h, emojiCache) {
  const labelH = h * 0.30;
  const emojiH = h - labelH;
  const bg = FITZ_BG[tile.color] || [255,255,255];
  const lbl = FITZ_LABEL[tile.color] || [100,100,100];

  // Background emoji area (vettoriale, angoli arrotondati)
  pdf.setFillColor(bg[0], bg[1], bg[2]);
  pdf.roundedRect(x, y, w, emojiH + 0.5, 1.8, 1.8, 'F');

  // Background label
  pdf.setFillColor(lbl[0], lbl[1], lbl[2]);
  pdf.rect(x, y + emojiH, w, labelH, 'F');

  // Bordo esterno
  pdf.setDrawColor(225);
  pdf.setLineWidth(0.12);
  pdf.roundedRect(x, y, w, h, 1.8, 1.8, 'S');

  // Pittogramma o testo nell'area emoji
  if (tile.isText) {
    pdf.setTextColor(lbl[0], lbl[1], lbl[2]);
    pdf.setFont('helvetica', tile.color === 'arancio' ? 'bolditalic' : 'bold');
    // Dimensione adattiva: base in pt PDF ≈ visualmente equivalente a un'emoji
    // in una tessera 30mm × 36mm. Base 18pt per testo breve.
    const fontPt = textModeSize(tile.emoji, 18, { ignoreViewport: true });
    pdf.setFontSize(fontPt);
    const lines = tile.emoji.split('\n');
    // line-height ≈ fontSize * 0.35 (pt → mm: 1 pt = 0.353 mm)
    const lineH = fontPt * 0.40;
    const totalH = lines.length * lineH;
    const startY = y + emojiH/2 - totalH/2 + lineH * 0.7;
    lines.forEach((line, i) => {
      pdf.text(line, x + w/2, startY + i * lineH, { align: 'center' });
    });
  } else {
    const emoji = tile.emoji || '';
    const cacheKey = emoji + '@128';
    if (!emojiCache[cacheKey]) {
      // OpenMoji se disponibile, altrimenti emoji di sistema
      emojiCache[cacheKey] = await getEmojiPNGAsync(emoji, 128);
    }
    const imgData = emojiCache[cacheKey];
    const imgSize = Math.min(w * 0.62, emojiH * 0.78);
    pdf.addImage(imgData, 'PNG', x + (w - imgSize)/2, y + (emojiH - imgSize)/2, imgSize, imgSize);
  }

  // Label
  pdf.setTextColor(255, 255, 255);
  pdf.setFont('helvetica', 'bold');
  pdf.setFontSize(6.4);
  const labelText = (tile.word || '—').toUpperCase();
  const labelLines = pdf.splitTextToSize(labelText, w - 2);
  const maxLines = Math.min(labelLines.length, 2);
  const lineH = 2.4;
  const totalH = maxLines * lineH;
  const startY = y + emojiH + (labelH - totalH)/2 + lineH * 0.75;
  for (let i = 0; i < maxLines; i++) {
    pdf.text(labelLines[i], x + w/2, startY + i * lineH, { align: 'center' });
  }
}

async function exportVectorPDF(project) {
  if (!project) return;
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4', compress: true });
  const pageW = pdf.internal.pageSize.getWidth();   // 297
  const pageH = pdf.internal.pageSize.getHeight();  // 210
  const margin = 12;
  const contentW = pageW - 2 * margin;
  const TILE_W = 30;
  const TILE_H = 36;
  const TILE_GAP = 3;
  const ROW_GAP = 3;
  const NUCLEUS_TITLE_H = 7;
  const NUCLEUS_GAP = 10;

  // ── Preload OpenMoji per tutte le emoji uniche del progetto ──
  const uniqueEmojis = [...new Set(
    project.nuclei.flatMap(n => n.tiles.filter(t => !t.isText).map(t => t.emoji)).filter(Boolean)
  )];
  await preloadOpenmoji(uniqueEmojis, 6);

  const emojiCache = {};

  // ─ Intestazione documento ─
  pdf.setFont('helvetica', 'bold');
  pdf.setFontSize(15);
  pdf.setTextColor(60);
  pdf.text(project.title || 'Tavola CAA', pageW / 2, margin + 2, { align: 'center' });

  let cursorY = margin + 8;

  // ─ Legenda Fitzgerald (vettoriale) ─
  pdf.setFontSize(7.5);
  const legendItems = FITZGERALD.map(f => ({ name: f.name.split('/')[0].trim(), color: hexToRgb(f.label) }));
  const totalLegendW = legendItems.reduce((acc, it) => acc + pdf.getTextWidth(it.name) + 8, 0);
  let legendX = (pageW - totalLegendW) / 2;
  legendItems.forEach(it => {
    pdf.setFillColor(it.color[0], it.color[1], it.color[2]);
    pdf.circle(legendX + 1.5, cursorY + 1, 1.4, 'F');
    pdf.setTextColor(110);
    pdf.text(it.name, legendX + 4, cursorY + 1.8);
    legendX += pdf.getTextWidth(it.name) + 8;
  });
  cursorY += 7;

  // ─ Nuclei (Punto 21: ogni nucleo è un blocco non spezzabile a metà se possibile) ─
  for (const nucleus of project.nuclei) {
    // Calcola spazio richiesto
    const tilesPerRow = Math.max(1, Math.floor((contentW + TILE_GAP) / (TILE_W + TILE_GAP)));
    const rows = Math.max(1, Math.ceil((nucleus.tiles.length || 1) / tilesPerRow));
    const tilesBlockH = rows * TILE_H + (rows - 1) * ROW_GAP;
    const hasBody = nucleus.body && nucleus.body.trim();
    // Stima altezza body (text wrapping)
    const bodyText = hasBody ? `«${nucleus.body.trim()}»` : '';
    pdf.setFont('helvetica', 'italic');
    pdf.setFontSize(9);
    const bodyLines = hasBody ? pdf.splitTextToSize(bodyText, contentW * 0.85) : [];
    const bodyH = hasBody ? (bodyLines.length * 3.6 + 2) : 0;
    const neededH = NUCLEUS_TITLE_H + bodyH + tilesBlockH + NUCLEUS_GAP;

    // Se non c'entra nello spazio residuo, nuova pagina (Punto 21)
    if (cursorY + neededH > pageH - margin) {
      pdf.addPage();
      cursorY = margin;
    }

    // Titolo nucleo
    pdf.setFont('helvetica', 'bold');
    pdf.setFontSize(9);
    pdf.setTextColor(135);
    pdf.text((nucleus.title || '').toUpperCase(), pageW / 2, cursorY + 4, { align: 'center' });
    cursorY += NUCLEUS_TITLE_H;

    // Body (frase intera) se presente
    if (hasBody) {
      pdf.setFont('helvetica', 'italic');
      pdf.setFontSize(9);
      pdf.setTextColor(95);
      bodyLines.forEach((line, i) => {
        pdf.text(line, pageW / 2, cursorY + 2 + i * 3.6, { align: 'center' });
      });
      cursorY += bodyH;
    }

    // Tessere
    if (nucleus.tiles.length === 0) {
      pdf.setFontSize(8);
      pdf.setTextColor(190);
      pdf.setFont('helvetica', 'italic');
      pdf.text('(nucleo vuoto)', pageW / 2, cursorY + 6, { align: 'center' });
      cursorY += 10;
    } else {
      // Layout: prima riga centrata se entra tutto, altrimenti wrap dal margine
      const fitsOneRow = nucleus.tiles.length <= tilesPerRow;
      let rowTiles = nucleus.tiles.slice();
      let ry = cursorY;
      while (rowTiles.length > 0) {
        const thisRow = rowTiles.splice(0, tilesPerRow);
        const rowW = thisRow.length * TILE_W + (thisRow.length - 1) * TILE_GAP;
        const startX = fitsOneRow
          ? (pageW - rowW) / 2
          : margin + Math.max(0, (contentW - rowW) / 2);
        let rx = startX;
        for (const tile of thisRow) {
          await drawTileVector(pdf, tile, rx, ry, TILE_W, TILE_H, emojiCache);
          rx += TILE_W + TILE_GAP;
        }
        ry += TILE_H + ROW_GAP;
      }
      cursorY = ry - ROW_GAP;
    }
    cursorY += NUCLEUS_GAP;
  }

  // ─ Footer paginazione ─
  const pageCount = pdf.internal.getNumberOfPages();
  for (let p = 1; p <= pageCount; p++) {
    pdf.setPage(p);
    pdf.setFont('helvetica', 'normal');
    pdf.setFontSize(7);
    pdf.setTextColor(170);
    pdf.text(`${p} / ${pageCount}`, pageW - margin, pageH - 5, { align: 'right' });
    pdf.text('Inclusia — Editor CAA', margin, pageH - 5);
  }

  const safeName = (project.title || 'tavola_caa').replace(/[^a-z0-9]/gi, '_').slice(0, 60);
  pdf.save(`${safeName}.pdf`);
}

/* ════════════════════════════════════════════════════════════
   EXPORT PNG (Punto 22: ridimensionamento dinamico)
   ════════════════════════════════════════════════════════════ */
async function exportPNGSized(project, previewElementId='preview-content') {
  const element = document.getElementById(previewElementId);
  if (!element) throw new Error('Preview non trovata');

  // Ridimensionamento dinamico: limite ~4 megapixel totale per evitare file gigantesche
  const naturalW = element.scrollWidth;
  const naturalH = element.scrollHeight;
  const maxMegaPx = 6;            // soglia ragionevole
  const baseScale = 2;
  const wouldBeMP = (naturalW * baseScale * naturalH * baseScale) / 1_000_000;
  let scale = baseScale;
  if (wouldBeMP > maxMegaPx) {
    scale = Math.max(1, Math.sqrt((maxMegaPx * 1_000_000) / (naturalW * naturalH)));
  }
  scale = Math.round(scale * 100) / 100;

  const canvas = await html2canvas(element, {
    scale,
    backgroundColor: '#ffffff',
    useCORS: true,
    logging: false,
    windowWidth: Math.max(element.scrollWidth, 800)
  });

  // Conversione → blob con qualità adattiva
  return new Promise((resolve, reject) => {
    canvas.toBlob(blob => {
      if (!blob) return reject(new Error('Conversione canvas fallita'));
      resolve({ blob, scale, w: canvas.width, h: canvas.height });
    }, 'image/png');
  });
}

/* ════════════════════════════════════════════════════════════
   EXPORT POWERPOINT (PPTX)
   ─ 1 slide per nucleo (= 1 "frase")
   ─ 16:9 widescreen (25.4 × 14.3 cm = 10" × 5.625")
   ─ Sfondo slide trasparente (noFill via master vuoto)
   ─ Tessere mantengono colori Fitzgerald
   ─ Emoji come SVG OpenMoji embedded → veri vettoriali in PowerPoint 2019+
   ─ Layout adattivo: <8 tessere = riga unica; ≥8 = wrap multirighe
   ════════════════════════════════════════════════════════════ */

function rgbToHex(rgb) {
  // [r,g,b] (0-255) → "RRGGBB"
  return rgb.map(c => Math.max(0, Math.min(255, Math.round(c))).toString(16).padStart(2, '0')).join('').toUpperCase();
}

// Layout adattivo: data una count di tessere, decide righe×colonne ottimali per 16:9
function computeAdaptiveLayout(n, slideW, slideH, marginTop, marginBottom) {
  if (n <= 1) return { cols: 1, rows: 1 };
  // < 8 tessere: una riga sola
  if (n < 8) return { cols: n, rows: 1 };
  // ≥ 8: griglia con ratio circa 16:9 dell'area disponibile, e tile aspect 1:1.3
  const availW = slideW;
  const availH = slideH - marginTop - marginBottom;
  // Cerca la griglia (cols, rows) con cols*rows >= n che minimizza spazio sprecato
  let best = null;
  for (let cols = 2; cols <= n; cols++) {
    const rows = Math.ceil(n / cols);
    // Tile size se uso quel layout
    const tileW = availW / cols;
    const tileH = availH / rows;
    // Mantieni aspect 1:1.3 (altezza maggiore di larghezza)
    // Scegli la min dimensione che rispetta il ratio
    const effTileW = Math.min(tileW, tileH / 1.3);
    const effTileH = effTileW * 1.3;
    // Score: massimizza effTileW
    if (!best || effTileW > best.effTileW) {
      best = { cols, rows, effTileW, effTileH };
    }
  }
  return best;
}

function drawTilePPTX(slide, tile, x, y, w, h) {
  const labelH = h * 0.30;
  const emojiH = h - labelH;
  const bg = FITZ_BG[tile.color] || [255,255,255];
  const lbl = FITZ_LABEL[tile.color] || [100,100,100];
  const bgHex = rgbToHex(bg);
  const lblHex = rgbToHex(lbl);

  // Sfondo area emoji (rettangolo arrotondato)
  slide.addShape('roundRect', {
    x, y, w, h: emojiH + 0.02,
    fill: { color: bgHex },
    line: { color: 'DDDDDD', width: 0.4 },
    rectRadius: 0.05
  });

  // Sfondo label (rettangolo pieno)
  slide.addShape('rect', {
    x, y: y + emojiH, w, h: labelH,
    fill: { color: lblHex },
    line: { type: 'none' }
  });

  // Emoji o testo nell'area emoji
  if (tile.isText) {
    const lines = tile.emoji.split('\n');
    // Base 32pt per testo breve, scalato in base a contenuto.
    // Visualmente equivalente a un'emoji 65-85% della tessera.
    const fontPt = textModeSize(tile.emoji, 32, { ignoreViewport: true });
    slide.addText(lines.join('\n'), {
      x: x + 0.05, y, w: w - 0.1, h: emojiH,
      fontSize: Math.round(fontPt),
      bold: true,
      color: lblHex,
      align: 'center', valign: 'middle',
      italic: tile.color === 'arancio',
      fontFace: 'Helvetica',
      autoFit: true
    });
  } else {
    const cache = getOpenmojiCache();
    const svgData = cache[tile.emoji];
    const emojiSize = Math.min(w * 0.65, emojiH * 0.85);
    const emojiX = x + (w - emojiSize) / 2;
    const emojiY = y + (emojiH - emojiSize) / 2;
    if (svgData) {
      // SVG OpenMoji embedded = vettoriale puro
      slide.addImage({
        data: svgData,
        x: emojiX, y: emojiY,
        w: emojiSize, h: emojiSize
      });
    } else {
      // Fallback: emoji come testo Unicode (vettoriale via font)
      slide.addText(tile.emoji || '', {
        x, y, w, h: emojiH,
        fontSize: Math.round(emojiSize * 36),
        align: 'center', valign: 'middle',
        fontFace: 'Segoe UI Emoji'
      });
    }
  }

  // Label (parola, bianco grassetto)
  slide.addText((tile.word || '—').toUpperCase(), {
    x: x + 0.05, y: y + emojiH, w: w - 0.1, h: labelH,
    fontSize: Math.max(7, Math.min(11, w * 8)),
    bold: true,
    color: 'FFFFFF',
    align: 'center', valign: 'middle',
    fontFace: 'Helvetica',
    autoFit: true
  });
}

async function exportPPTX(project) {
  if (!project) throw new Error('Nessun progetto');
  if (typeof PptxGenJS === 'undefined') throw new Error('Libreria PptxGenJS non caricata');

  // 1. Preload OpenMoji per tutte le emoji uniche
  const uniqueEmojis = [...new Set(
    project.nuclei.flatMap(n => n.tiles.filter(t => !t.isText).map(t => t.emoji)).filter(Boolean)
  )];
  await preloadOpenmoji(uniqueEmojis, 6);

  // 2. Crea presentazione 16:9
  const pres = new PptxGenJS();
  pres.defineLayout({ name: 'INCLUSIA_169', width: 10, height: 5.625 });
  pres.layout = 'INCLUSIA_169';
  pres.title = project.title || 'Tavola CAA';
  pres.author = 'Inclusia — Editor CAA';
  pres.company = 'Inclusia';

  // 3. Slide master "trasparente" (noFill)
  // pptxgenjs non espone direttamente noFill, ma omettendo background si ottiene
  // il fill del master. Definiamo un master vuoto con transparency 100.
  pres.defineSlideMaster({
    title: 'INCLUSIA_EMPTY',
    background: { color: 'FFFFFF', transparency: 100 },
    objects: []
  });

  // 4. Per ogni nucleo, una slide
  const SLIDE_W = 10;
  const SLIDE_H = 5.625;
  const MARGIN_X = 0.4;
  const TITLE_Y = 0.18;
  const TITLE_H = 0.45;
  const BODY_H_BASE = 0.45;     // altezza body se presente
  const MARGIN_BOTTOM = 0.25;

  for (const nucleus of project.nuclei) {
    const slide = pres.addSlide({ masterName: 'INCLUSIA_EMPTY' });
    slide.background = { color: 'FFFFFF', transparency: 100 };

    const hasBody = nucleus.body && nucleus.body.trim();
    const bodyH = hasBody ? BODY_H_BASE : 0;
    const TILES_TOP = TITLE_Y + TITLE_H + (hasBody ? bodyH + 0.1 : 0.1);

    // Titolo nucleo
    slide.addText(nucleus.title || '', {
      x: MARGIN_X, y: TITLE_Y, w: SLIDE_W - 2 * MARGIN_X, h: TITLE_H,
      fontSize: 22, bold: true, color: '555555',
      align: 'center', valign: 'middle',
      fontFace: 'Helvetica',
      charSpacing: 3
    });

    // Body (frase intera) se presente
    if (hasBody) {
      slide.addText('«' + nucleus.body.trim() + '»', {
        x: MARGIN_X + 0.5, y: TITLE_Y + TITLE_H + 0.02,
        w: SLIDE_W - 2 * MARGIN_X - 1.0, h: bodyH,
        fontSize: 14, italic: true, color: '666666',
        align: 'center', valign: 'middle',
        fontFace: 'Helvetica',
        autoFit: true
      });
    }

    const tiles = nucleus.tiles;
    if (tiles.length === 0) {
      slide.addText('(nucleo vuoto)', {
        x: 1, y: SLIDE_H / 2 - 0.2, w: SLIDE_W - 2, h: 0.4,
        fontSize: 14, italic: true, color: 'AAAAAA',
        align: 'center', valign: 'middle'
      });
      continue;
    }

    // Layout adattivo
    const usableW = SLIDE_W - 2 * MARGIN_X;
    const usableH = SLIDE_H - TILES_TOP - MARGIN_BOTTOM;
    const { cols, rows } = computeAdaptiveLayout(tiles.length, usableW, usableH, TILES_TOP, MARGIN_BOTTOM);

    const gapX = 0.12;
    const gapY = 0.15;

    // Calcola tile size mantenendo aspect 1:1.3
    const maxTileW = (usableW - (cols - 1) * gapX) / cols;
    const maxTileH = (usableH - (rows - 1) * gapY) / rows;
    let tileW, tileH;
    if (maxTileW * 1.3 <= maxTileH) {
      tileW = maxTileW;
      tileH = maxTileW * 1.3;
    } else {
      tileH = maxTileH;
      tileW = maxTileH / 1.3;
    }
    // Cap dimensione massima ragionevole per leggibilità
    tileW = Math.min(tileW, 1.8);
    tileH = Math.min(tileH, 2.3);

    // Centra il blocco tessere nell'area
    const blockW = cols * tileW + (cols - 1) * gapX;
    const blockH = rows * tileH + (rows - 1) * gapY;
    const startX = MARGIN_X + (usableW - blockW) / 2;
    const startY = TILES_TOP + (usableH - blockH) / 2;

    // Disponi le tessere — l'ultima riga potrebbe avere meno tessere: centrala
    let placed = 0;
    for (let r = 0; r < rows; r++) {
      const remaining = tiles.length - placed;
      const tilesThisRow = Math.min(cols, remaining);
      const rowW = tilesThisRow * tileW + (tilesThisRow - 1) * gapX;
      const rowStartX = MARGIN_X + (usableW - rowW) / 2;
      const ty = startY + r * (tileH + gapY);
      for (let c = 0; c < tilesThisRow; c++) {
        const tx = rowStartX + c * (tileW + gapX);
        drawTilePPTX(slide, tiles[placed], tx, ty, tileW, tileH);
        placed++;
      }
    }
  }

  // 5. Salva
  const safeName = (project.title || 'tavola_caa').replace(/[^a-z0-9]/gi, '_').slice(0, 60);
  await pres.writeFile({ fileName: safeName + '.pptx' });
}

/* ════════════════════════════════════════════════════════════
   APP PRINCIPALE
   ════════════════════════════════════════════════════════════ */
function App() {
  const [projects, setProjects] = useState([]);
  const [currentId, setCurrentId] = useState(null);
  const [view, setView] = useState('editor');
  const [toast, setToast] = useState('');
  const [exporting, setExporting] = useState(false);
  const [projectSearch, setProjectSearch] = useState('');
  const [recentEmojis, setRecentEmojis] = useState([]);
  const [tileLibrary, setTileLibrary] = useState([]);
  const [templatesOpen, setTemplatesOpen] = useState(false);
  const [importOpen, setImportOpen] = useState(false);
  const [confirmState, setConfirmState] = useState(null); // {title,message,onConfirm,danger}

  const fileInputRef = useRef(null);
  const initialized = useRef(false);

  // ─ History per undo/redo (Punto 8) ─
  const historyRef = useRef({ past: [], future: [] });
  const [historyTick, setHistoryTick] = useState(0); // forza re-render quando cambia lo stack

  // ─ Caricamento iniziale ─
  useEffect(() => {
    if (initialized.current) return;
    initialized.current = true;
    const data = loadFromStorage();
    if (data && data.projects && data.projects.length > 0) {
      // Migrate: assicura body presente sui nuclei
      const migrated = data.projects.map(p => ({
        ...p,
        nuclei: (p.nuclei || []).map(normalizeNucleus)
      }));
      setProjects(migrated);
      setCurrentId(data.currentId || migrated[0].id);
    } else {
      const example = exampleProject();
      setProjects([example]);
      setCurrentId(example.id);
    }
    setRecentEmojis(loadRecentEmojis());
    setTileLibrary(loadTileLibrary());
  }, []);

  // ─ Salvataggio automatico DEBOUNCED (Punti 4 + 18) ─
  const debouncedSave = useMemo(() => debounce((payload) => {
    saveToStorage(payload);
  }, 300), []);
  useEffect(() => {
    if (!initialized.current || projects.length === 0) return;
    debouncedSave({ projects, currentId });
  }, [projects, currentId, debouncedSave]);

  // Flush save quando la pagina viene chiusa
  useEffect(() => {
    const handler = () => {
      debouncedSave.flush();
      if (projects.length) saveToStorage({ projects, currentId });
    };
    window.addEventListener('beforeunload', handler);
    return () => window.removeEventListener('beforeunload', handler);
  }, [projects, currentId, debouncedSave]);

  const currentProject = projects.find(p => p.id === currentId);

  // ─ Mutazione con history (Punto 8) ─
  const HISTORY_MAX = 50;
  const applyMutation = useCallback((mutator) => {
    setProjects(prev => {
      historyRef.current.past.push(JSON.parse(JSON.stringify(prev)));
      if (historyRef.current.past.length > HISTORY_MAX) historyRef.current.past.shift();
      historyRef.current.future = [];
      setHistoryTick(t => t + 1);
      return typeof mutator === 'function' ? mutator(prev) : mutator;
    });
  }, []);

  const undo = useCallback(() => {
    setProjects(prev => {
      if (!historyRef.current.past.length) return prev;
      const previous = historyRef.current.past.pop();
      historyRef.current.future.push(JSON.parse(JSON.stringify(prev)));
      setHistoryTick(t => t + 1);
      return previous;
    });
  }, []);

  const redo = useCallback(() => {
    setProjects(prev => {
      if (!historyRef.current.future.length) return prev;
      const next = historyRef.current.future.pop();
      historyRef.current.past.push(JSON.parse(JSON.stringify(prev)));
      setHistoryTick(t => t + 1);
      return next;
    });
  }, []);

  // ─ Keyboard shortcuts (Punto 7) ─
  useEffect(() => {
    const handler = (e) => {
      // Non interferire con input editabili (eccetto Esc gestito altrove e Ctrl+Z/Y per undo globale)
      const isEditable = e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.isContentEditable);
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !e.shiftKey) {
        e.preventDefault(); undo();
      } else if (((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') ||
                 ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 'z')) {
        e.preventDefault(); redo();
      } else if (e.key === 'Escape' && confirmState) {
        setConfirmState(null);
      }
    };
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, [undo, redo, confirmState]);

  // ─ Operazioni su progetto ─
  const updateProject = (updated) => {
    applyMutation(prev => prev.map(p => p.id === updated.id ? {...updated, updatedAt: new Date().toISOString()} : p));
  };

  const updateTitle = (title) => {
    if (!currentProject) return;
    updateProject({...currentProject, title});
  };

  const createProjectFromTemplate = (template) => {
    const p = template.build();
    applyMutation(prev => [p, ...prev]);
    setCurrentId(p.id);
    setView('editor');
    setTemplatesOpen(false);
    setToast(`✨ Progetto "${template.name}" creato`);
  };

  const openNewProjectDialog = () => setTemplatesOpen(true);

  const duplicateProject = (id) => {
    const orig = projects.find(p => p.id === id);
    if (!orig) return;
    const copy = JSON.parse(JSON.stringify(orig));
    copy.id = uid();
    copy.title = orig.title + ' (copia)';
    copy.createdAt = new Date().toISOString();
    copy.updatedAt = new Date().toISOString();
    copy.nuclei = copy.nuclei.map(n => ({
      ...n, id: uid(),
      tiles: n.tiles.map(t => ({...t, id: uid()}))
    }));
    applyMutation(prev => [copy, ...prev]);
    setCurrentId(copy.id);
    setToast('📋 Progetto duplicato');
  };

  // (Punto 5) deleteProject ora usa modal stilizzata invece di confirm()
  const deleteProject = (id) => {
    const target = projects.find(p => p.id === id);
    if (!target) return;
    setConfirmState({
      title: 'Eliminare il progetto?',
      message: <>Stai per eliminare <strong>«{target.title}»</strong>. L'azione può essere annullata con <kbd>Ctrl+Z</kbd> finché la pagina resta aperta.</>,
      confirmLabel: 'Elimina',
      danger: true,
      onConfirm: () => {
        applyMutation(prev => {
          const remaining = prev.filter(p => p.id !== id);
          if (currentId === id) setCurrentId(remaining[0]?.id || null);
          return remaining;
        });
        setConfirmState(null);
        setToast('🗑 Progetto eliminato');
      }
    });
  };

  // ─ Operazioni su nuclei ─
  const updateNucleus = (updated) => {
    if (!currentProject) return;
    if (updated._moveDir) {
      const nuclei = [...currentProject.nuclei];
      const idx = nuclei.findIndex(n => n.id === updated.id);
      if (idx === -1) return;
      const newIdx = updated._moveDir === 'up' ? idx - 1 : idx + 1;
      if (newIdx < 0 || newIdx >= nuclei.length) return;
      [nuclei[idx], nuclei[newIdx]] = [nuclei[newIdx], nuclei[idx]];
      updateProject({...currentProject, nuclei});
      return;
    }
    updateProject({
      ...currentProject,
      nuclei: currentProject.nuclei.map(n => n.id === updated.id ? updated : n)
    });
  };

  const addNucleus = () => {
    if (!currentProject) return;
    updateProject({
      ...currentProject,
      nuclei: [...currentProject.nuclei, {
        id: uid(), title: `FRASE ${currentProject.nuclei.length + 1}`, body: '', tiles: []
      }]
    });
  };

  // Aggiunge un nucleo già strutturato (usato da ImportModal). Non tocca i nuclei esistenti.
  const appendNucleus = useCallback((newNucleus) => {
    if (!currentProject) return;
    updateProject({
      ...currentProject,
      nuclei: [...currentProject.nuclei, newNucleus]
    });
    setToast(`✓ Nucleo "${newNucleus.title}" aggiunto al progetto`);
  }, [currentProject]);

  const deleteNucleus = (id) => {
    if (!currentProject) return;
    if (currentProject.nuclei.length <= 1) { setToast('⚠️ Devi avere almeno un nucleo'); return; }
    setConfirmState({
      title: 'Eliminare il nucleo?',
      message: 'Le tessere del nucleo verranno rimosse. Puoi annullare con Ctrl+Z.',
      confirmLabel: 'Elimina',
      danger: true,
      onConfirm: () => {
        updateProject({...currentProject, nuclei: currentProject.nuclei.filter(n => n.id !== id)});
        setConfirmState(null);
      }
    });
  };

  // ─ Emoji recenti & libreria tessere (Punti 9 + 23) ─
  const handleUseRecent = useCallback((emoji) => {
    setRecentEmojis(prev => {
      const filtered = prev.filter(e => e !== emoji);
      const next = [emoji, ...filtered].slice(0, 24);
      saveRecentEmojis(next);
      return next;
    });
  }, []);

  const handleAddToLibrary = useCallback((tile) => {
    // Salva solo se la tessera ha word + è significativa
    if (!tile || !tile.word || tile.word.trim().length < 2) return;
    if (tile.word === 'Nuova') return;
    setTileLibrary(prev => {
      const key = (t) => `${t.color}|${t.emoji}|${t.word}|${t.isText?1:0}`;
      const k = key(tile);
      const filtered = prev.filter(t => key(t) !== k);
      const next = [tile, ...filtered].slice(0, 30);
      saveTileLibrary(next);
      return next;
    });
  }, []);

  const pickFromLibrary = (libTile) => {
    if (!currentProject) return;
    // Aggiunge al primo nucleo o nuovo nucleo se nessuno è presente
    const targetNuc = currentProject.nuclei[0];
    const copy = { ...libTile, id: uid() };
    updateProject({
      ...currentProject,
      nuclei: currentProject.nuclei.map((n, i) => i === 0
        ? { ...n, tiles: [...n.tiles, copy] }
        : n)
    });
    setToast(`➕ Tessera "${libTile.word}" aggiunta a "${targetNuc.title}"`);
  };

  const clearLibrary = () => {
    setConfirmState({
      title: 'Svuotare la libreria tessere?',
      message: 'Le tessere riutilizzabili verranno rimosse dalla libreria personale.',
      confirmLabel: 'Svuota',
      danger: true,
      onConfirm: () => {
        setTileLibrary([]);
        saveTileLibrary([]);
        setConfirmState(null);
        setToast('🗑 Libreria svuotata');
      }
    });
  };

  // ─ Esportazione ─
  const exportJSON = () => {
    const blob = new Blob([JSON.stringify({ projects, schemaVersion: SCHEMA_VERSION }, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `caa-backup-${new Date().toISOString().slice(0,10)}.json`;
    a.click(); URL.revokeObjectURL(url);
    setToast('💾 Backup JSON scaricato');
  };

  const exportCurrentJSON = () => {
    if (!currentProject) return;
    const blob = new Blob([JSON.stringify({ projects: [currentProject], schemaVersion: SCHEMA_VERSION }, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `${currentProject.title.replace(/[^a-z0-9]/gi, '_')}.json`;
    a.click(); URL.revokeObjectURL(url);
    setToast('💾 Progetto esportato');
  };

  const importJSON = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        if (!data.projects || !Array.isArray(data.projects)) throw new Error('Formato non valido');
        const imported = data.projects.map(p => ({
          ...p, id: uid(),
          nuclei: (p.nuclei || []).map(n => ({
            body: '', ...n, id: uid(),
            tiles: (n.tiles || []).map(t => ({...t, id: uid()}))
          }))
        }));
        applyMutation(prev => [...imported, ...prev]);
        if (imported[0]) setCurrentId(imported[0].id);
        setToast(`✅ Importati ${imported.length} progetto/i`);
      } catch (err) { setToast('❌ File non valido'); }
      e.target.value = '';
    };
    reader.readAsText(file);
  };

  const handlePrint = () => { setView('preview'); setTimeout(() => window.print(), 250); };

  // PDF: ora vettoriale (Punti 19 + 21)
  const handlePdfExport = async () => {
    if (!currentProject) return;
    setExporting(true);
    setToast('🔄 Generazione PDF vettoriale...');
    try {
      await new Promise(r => setTimeout(r, 50)); // lascia UI aggiornare
      await exportVectorPDF(currentProject);
      setToast('✅ PDF vettoriale scaricato');
    } catch (err) {
      console.error(err);
      setToast('❌ Errore PDF: ' + (err.message || 'sconosciuto'));
    } finally {
      setExporting(false);
    }
  };

  const handlePngExport = async () => {
    if (!currentProject) return;
    setView('preview');
    setExporting(true);
    setToast('🔄 Generazione immagine...');
    // Preload OpenMoji per le emoji del progetto
    const uniqueEmojis = [...new Set(
      currentProject.nuclei.flatMap(n => n.tiles.filter(t => !t.isText).map(t => t.emoji)).filter(Boolean)
    )];
    await preloadOpenmoji(uniqueEmojis, 6);
    await new Promise(r => setTimeout(r, 500)); // attendi rendering React
    try {
      const { blob, scale } = await exportPNGSized(currentProject);
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${currentProject.title.replace(/[^a-z0-9]/gi, '_')}.png`;
      a.click();
      URL.revokeObjectURL(url);
      setToast(`🖼 PNG scaricato (scala ${scale}×, ${(blob.size/1024).toFixed(0)} KB)`);
    } catch (err) {
      console.error(err);
      setToast('❌ Errore esportazione PNG');
    } finally {
      setExporting(false);
    }
  };

  // PowerPoint: 1 slide per nucleo, sfondo trasparente, OpenMoji vettoriale
  const handlePptxExport = async () => {
    if (!currentProject) return;
    setExporting(true);
    setToast('🔄 Generazione PowerPoint...');
    try {
      await exportPPTX(currentProject);
      setToast(`✅ PowerPoint scaricato (${currentProject.nuclei.length} slide)`);
    } catch (err) {
      console.error(err);
      setToast('❌ Errore PowerPoint: ' + (err.message || 'sconosciuto'));
    } finally {
      setExporting(false);
    }
  };

  // ─ Filtro progetti (Punto 9: ricerca/filtro) ─
  const filteredProjects = useMemo(() => {
    const q = projectSearch.trim().toLowerCase();
    if (!q) return projects;
    return projects.filter(p =>
      (p.title || '').toLowerCase().includes(q) ||
      (p.nuclei || []).some(n => (n.title || '').toLowerCase().includes(q))
    );
  }, [projects, projectSearch]);

  const canUndo = historyRef.current.past.length > 0;
  const canRedo = historyRef.current.future.length > 0;

  // ════════════ RENDER ════════════
  return (
    <div>
      <header className="app-header">
        <div className="app-title">
          <span className="icon" aria-hidden="true">🟦🟡🟢</span>
          <span>Inclusia <span style={{fontWeight:500, color:'#888', fontSize:12}}>Editor CAA</span></span>
        </div>
        <div className="header-actions">
          <div className="undo-redo">
            <button className="btn btn-icon btn-secondary" onClick={undo} disabled={!canUndo} title="Annulla (Ctrl+Z)" aria-label="Annulla">↶</button>
            <button className="btn btn-icon btn-secondary" onClick={redo} disabled={!canRedo} title="Ripeti (Ctrl+Y)" aria-label="Ripeti">↷</button>
          </div>
          <button className="btn btn-secondary btn-small" onClick={() => fileInputRef.current?.click()} title="Importa">📥 Importa</button>
          <input ref={fileInputRef} type="file" accept="application/json" onChange={importJSON} style={{display: 'none'}} />
          <button className="btn btn-secondary btn-small" onClick={exportJSON} title="Backup JSON di tutti i progetti">💾 Backup</button>
        </div>
      </header>

      <nav className="tab-nav" role="tablist">
        <button
          className={`tab-btn ${view === 'projects' ? 'active' : ''}`}
          onClick={() => setView('projects')}
          role="tab" aria-selected={view === 'projects'}
        >📁 Progetti ({projects.length})</button>
        <button
          className={`tab-btn ${view === 'editor' ? 'active' : ''}`}
          onClick={() => setView('editor')} disabled={!currentProject}
          role="tab" aria-selected={view === 'editor'}
        >✏️ Editor</button>
        <button
          className={`tab-btn ${view === 'preview' ? 'active' : ''}`}
          onClick={() => setView('preview')} disabled={!currentProject}
          role="tab" aria-selected={view === 'preview'}
        >👁 Anteprima</button>
      </nav>

      <main className="app-main">
        {/* ── PROGETTI ── */}
        {view === 'projects' && (
          <div className="panel editor-only">
            <div className="panel-title">
              <span>I tuoi progetti</span>
              <button className="btn btn-primary btn-small" onClick={openNewProjectDialog}>+ Nuovo progetto</button>
            </div>
            <input
              type="text"
              className="project-search"
              placeholder="🔍 Cerca per titolo o nucleo…"
              value={projectSearch}
              onChange={e => setProjectSearch(e.target.value)}
              aria-label="Cerca progetti"
            />
            {projects.length === 0 ? (
              <div className="empty-state">
                <div className="empty-state-icon" aria-hidden="true">📂</div>
                <div className="empty-state-text">Nessun progetto. Creane uno per iniziare.</div>
              </div>
            ) : filteredProjects.length === 0 ? (
              <div className="empty-state">
                <div className="empty-state-icon" aria-hidden="true">🔍</div>
                <div className="empty-state-text">Nessun progetto corrisponde a «{projectSearch}»</div>
              </div>
            ) : (
              <div className="project-list">
                {filteredProjects.map(p => (
                  <div
                    key={p.id}
                    className={`project-card ${p.id === currentId ? 'active' : ''}`}
                    onClick={() => { setCurrentId(p.id); setView('editor'); }}
                    role="button"
                    tabIndex={0}
                    onKeyDown={e => (e.key === 'Enter' || e.key === ' ') && (e.preventDefault(), setCurrentId(p.id), setView('editor'))}
                  >
                    <div className="project-card-title">{p.title}</div>
                    <div className="project-card-meta">
                      <span>{p.nuclei.length} frase/i</span>
                      <span>{fmtDate(p.updatedAt)}</span>
                    </div>
                    <div className="project-card-actions" onClick={e => e.stopPropagation()}>
                      <button className="btn btn-secondary btn-small" onClick={() => duplicateProject(p.id)} aria-label="Duplica">📋</button>
                      <button className="btn btn-secondary btn-small" onClick={(e) => { e.stopPropagation(); setCurrentId(p.id); exportCurrentJSON(); }} aria-label="Esporta">💾</button>
                      <button className="btn btn-danger btn-small" onClick={() => deleteProject(p.id)} aria-label="Elimina">🗑</button>
                    </div>
                  </div>
                ))}
              </div>
            )}
            <div className="help-tip" style={{marginTop: 16}}>
              💡 I tuoi progetti sono salvati automaticamente nel browser (con un breve ritardo per non rallentare la digitazione). Per portarli su un altro dispositivo usa <strong>💾 Backup</strong>.
              <br/>⌨️ Scorciatoie: <kbd>Ctrl+Z</kbd> annulla, <kbd>Ctrl+Y</kbd> ripeti, <kbd>Esc</kbd> chiude i pannelli.
            </div>
          </div>
        )}

        {/* ── EDITOR ── */}
        {view === 'editor' && currentProject && (
          <>
            {/* ── PRELIMINARE: Import testo → CAA (finestra separata) ── */}
            <div className="panel editor-only" style={{borderLeft: '4px solid #1565C0', background: 'linear-gradient(to right, #E3F2FD 0%, white 40%)'}}>
              <div style={{display: 'flex', alignItems: 'center', gap: 12, flexWrap: 'wrap'}}>
                <div style={{flex: '1 1 280px', minWidth: 0}}>
                  <div style={{fontWeight: 700, fontSize: 14, color: '#1565C0', marginBottom: 4}}>
                    📝 Preliminare: importa un testo da trasformare in CAA
                  </div>
                  <div style={{fontSize: 12, color: '#555', lineHeight: 1.5}}>
                    Apri una finestra separata per incollare frasi o paragrafi, scomporli automaticamente, semplificare e tokenizzare secondo Fitzgerald. I nuclei che generi vengono aggiunti qui sotto al tuo progetto; i nuclei già presenti restano intatti.
                  </div>
                </div>
                <button
                  className="btn btn-primary"
                  onClick={() => setImportOpen(true)}
                  aria-label="Apri finestra di import preliminare"
                >📝 Apri import testo</button>
              </div>
            </div>

            <div className="panel editor-only">
              <input
                type="text"
                className="title-input"
                value={currentProject.title}
                onChange={e => updateTitle(e.target.value)}
                placeholder="Titolo del testo originale"
                aria-label="Titolo del progetto"
              />
              <div className="help-tip">
                💡 Tocca una tessera per modificarla, premi <kbd>Canc</kbd> per eliminarla. Ogni colore corrisponde a una categoria grammaticale (Codice di Fitzgerald). Il salvataggio è automatico e differito (~300 ms).
              </div>
              {currentProject.nuclei.map((nucleus) => (
                <NucleusBlock
                  key={nucleus.id}
                  nucleus={nucleus}
                  onUpdate={updateNucleus}
                  onDelete={() => deleteNucleus(nucleus.id)}
                  isOnly={currentProject.nuclei.length <= 1}
                  recentEmojis={recentEmojis}
                  onUseRecent={handleUseRecent}
                  onAddToLibrary={handleAddToLibrary}
                />
              ))}
              <button className="btn btn-primary" onClick={addNucleus} style={{marginTop: 8}}>
                + Aggiungi frase / nucleo
              </button>
            </div>

            <div className="panel editor-only">
              <div className="panel-title">
                <span>📚 Libreria tessere ({tileLibrary.length})</span>
              </div>
              <TileLibrary library={tileLibrary} onPick={pickFromLibrary} onClear={clearLibrary} />
            </div>

            <div className="panel editor-only">
              <div className="panel-title">Esporta</div>
              <div style={{display: 'flex', gap: 8, flexWrap: 'wrap'}}>
                <button className="btn btn-success" onClick={handlePdfExport} disabled={exporting}>📄 PDF vettoriale</button>
                <button className="btn btn-success" onClick={handlePptxExport} disabled={exporting}>📊 PowerPoint</button>
                <button className="btn btn-success" onClick={handlePngExport} disabled={exporting}>🖼 PNG</button>
                <button className="btn btn-secondary" onClick={handlePrint}>🖨 Stampa</button>
                <button className="btn btn-secondary" onClick={exportCurrentJSON}>💾 JSON progetto</button>
              </div>
              <div style={{marginTop: 10, fontSize: 11, color: '#888'}}>
                <strong>PDF</strong>: vettoriale, paginato per nucleo, parole selezionabili. <strong>PowerPoint</strong>: 1 slide per frase/nucleo (16:9), sfondo trasparente, emoji OpenMoji come SVG vettoriali (qualità nativa in PowerPoint 2019+/M365).
              </div>
            </div>
          </>
        )}

        {/* ── ANTEPRIMA ── */}
        {view === 'preview' && currentProject && (
          <>
            <div className="panel editor-only" style={{display: 'flex', gap: 8, flexWrap: 'wrap', alignItems: 'center'}}>
              <div style={{flex: 1, fontSize: 13, color: '#666'}}>
                Ecco come apparirà la tavola stampata o esportata.
              </div>
              <button className="btn btn-success" onClick={handlePdfExport} disabled={exporting}>📄 PDF</button>
              <button className="btn btn-success" onClick={handlePptxExport} disabled={exporting}>📊 PPTX</button>
              <button className="btn btn-success" onClick={handlePngExport} disabled={exporting}>🖼 PNG</button>
              <button className="btn btn-secondary" onClick={handlePrint}>🖨 Stampa</button>
            </div>
            <PreviewView project={currentProject} />
          </>
        )}

        {!currentProject && view !== 'projects' && (
          <div className="panel">
            <div className="empty-state">
              <div className="empty-state-icon" aria-hidden="true">🎨</div>
              <div className="empty-state-text">Nessun progetto attivo. Vai a "Progetti" per crearne uno.</div>
              <button className="btn btn-primary" onClick={openNewProjectDialog} style={{marginTop: 12}}>+ Crea il primo progetto</button>
            </div>
          </div>
        )}
      </main>

      <TemplatesModal
        open={templatesOpen}
        onClose={() => setTemplatesOpen(false)}
        onSelect={createProjectFromTemplate}
      />

      <ImportModal
        open={importOpen}
        onClose={() => setImportOpen(false)}
        onAddNucleus={appendNucleus}
        projectNucleiCount={currentProject?.nuclei.length || 0}
      />

      <ConfirmDialog
        open={!!confirmState}
        title={confirmState?.title}
        message={confirmState?.message}
        confirmLabel={confirmState?.confirmLabel}
        danger={confirmState?.danger}
        onConfirm={() => confirmState?.onConfirm()}
        onCancel={() => setConfirmState(null)}
      />

      <Toast message={toast} onDone={() => setToast('')} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(
  <ErrorBoundary>
    <App />
  </ErrorBoundary>
);
</script>
</body>
</html>
